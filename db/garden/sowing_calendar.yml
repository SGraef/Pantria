# Curated sowing/harvest calendar for common garden crops.
#
# Perenual has no per-month sowing/harvest data, so Homestead ships this small
# table. Months are 1-12 and reflect a Central-European (hardiness zone ~7,
# northern-hemisphere) outdoor/main-season rhythm -- a sensible default a
# gardener can override per plant. `names` are match aliases (de + en), matched
# case/accent-insensitively against a plant's common name.
#
# Each entry:
#   key:     canonical crop key (also used by companions.yml)
#   names:   [aliases...] matched against the plant name
#   sow:     [from_month, to_month]
#   harvest: [from_month, to_month]
crops:
  - key: tomato
    names: [tomato, tomate, tomaten]
    sow: [3, 4]
    harvest: [7, 10]
  - key: potato
    names: [potato, kartoffel, kartoffeln]
    sow: [4, 5]
    harvest: [7, 10]
  - key: carrot
    names: [carrot, karotte, moehre, mohre, mohren]
    sow: [3, 6]
    harvest: [6, 10]
  - key: lettuce
    names: [lettuce, salat, kopfsalat, pfluecksalat]
    sow: [3, 8]
    harvest: [5, 10]
  - key: radish
    names: [radish, radieschen]
    sow: [3, 9]
    harvest: [4, 10]
  - key: bean
    names: [bean, beans, bohne, bohnen, buschbohne, stangenbohne]
    sow: [5, 6]
    harvest: [7, 10]
  - key: pea
    names: [pea, peas, erbse, erbsen]
    sow: [3, 5]
    harvest: [6, 8]
  - key: cucumber
    names: [cucumber, gurke, gurken, salatgurke]
    sow: [4, 5]
    harvest: [7, 9]
  - key: zucchini
    names: [zucchini, courgette]
    sow: [4, 5]
    harvest: [7, 10]
  - key: pumpkin
    names: [pumpkin, kuerbis, kurbis, squash]
    sow: [4, 5]
    harvest: [9, 10]
  - key: onion
    names: [onion, zwiebel, zwiebeln]
    sow: [3, 4]
    harvest: [7, 9]
  - key: garlic
    names: [garlic, knoblauch]
    sow: [10, 11]
    harvest: [6, 8]
  - key: basil
    names: [basil, basilikum]
    sow: [3, 6]
    harvest: [6, 10]
  - key: parsley
    names: [parsley, petersilie]
    sow: [3, 7]
    harvest: [5, 11]
  - key: spinach
    names: [spinach, spinat]
    sow: [3, 9]
    harvest: [5, 11]
  - key: beetroot
    names: [beetroot, beet, rote bete, rote beete, randen]
    sow: [4, 6]
    harvest: [7, 10]
  - key: kale
    names: [kale, gruenkohl, grunkohl]
    sow: [5, 6]
    harvest: [10, 2]
  - key: pepper
    names: [pepper, paprika, chili, chilli, peperoni]
    sow: [2, 3]
    harvest: [7, 10]
  - key: strawberry
    names: [strawberry, erdbeere, erdbeeren]
    sow: [7, 8]
    harvest: [5, 7]
  - key: chard
    names: [chard, mangold]
    sow: [4, 7]
    harvest: [6, 11]
